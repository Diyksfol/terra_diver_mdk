name: Generate File List

on:
  push:
    branches: [main]
  workflow_dispatch:      # можно запустить вручную из GitHub UI

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build FILELIST.md
        run: |
          REPO="Diyksfol/terra_diver_mdk"
          BRANCH="main"
          BASE="https://raw.githubusercontent.com/${REPO}/${BRANCH}"

          {
            echo "# File List — ${REPO}"
            echo "_Обновлён: $(date -u '+%Y-%m-%d %H:%M UTC')_"
            echo ""
            find src -name "*.java" | sort | while read f; do
              echo "- [${f}](${BASE}/${f})"
            done
          } > FILELIST.md

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add FILELIST.md
          git diff --staged --quiet || git commit -m "chore: update FILELIST"
          git push