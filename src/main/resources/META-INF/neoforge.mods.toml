# neoforge.mods.toml - metadata for Create: Terra Diver
# Placeholders such as mod_id and mod_version come from gradle.properties at build time.
# Keep this file ASCII: processResources runs it through a Groovy template engine.

modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="LGPL-2.1-only"
issueTrackerURL="https://github.com/Diyksfol/terra_diver_mdk/issues"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="Create: Terra Diver" #mandatory
authors="Diyksfol"
credits="Built on the Create framework. Thanks to the Create, Sable, Aeronautics and Offroad teams."
enumExtensions="META-INF/enumextensions.json"
description='''
Create: Terra Diver brings drilling contraptions underground.

Build directional multiblock drill crowns - copper, iron, brass and netherite, in sizes from a single 1x1 cutter up to a massive 11x11 ring - mount them on a bearing and bore through stone. Drilling is driven by depth pressure, accumulated resistance and material hardness: the deeper you dig, the harder the rock pushes back.

An addon to Create. The sky belongs to Aeronautics, the seas to Deep Seas - the depths are yours.
'''

[[mixins]]
config="terra_diver.mixins.json"

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    versionRange="[0.5,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="aeronautics"
    type="required"
    versionRange="[0.6,)"
    ordering="AFTER"
    side="BOTH"